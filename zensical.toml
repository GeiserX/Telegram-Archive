# Generated from mkdocs.yml by mkdocs-to-zensical.py; the why of every block is in
# new-repo/templates/zensical.toml. Edit this file, not mkdocs.yml, which is gone.

[project]
site_name = "Telegram Archive"
site_url = "https://geiserx.github.io/Telegram-Archive/"
site_description = "Self-hosted Telegram backup with a web viewer. Messages, media and edits stay on your own disk."
repo_url = "https://github.com/GeiserX/Telegram-Archive"
repo_name = "GeiserX/Telegram-Archive"
edit_uri = "edit/main/docs/"
strict = true
extra_css = ["stylesheets/theme.css"]
exclude_docs = """
# Any name with a capital letter is a repo-facing note, never a page. The
# named lines below say why each known note is one; this pattern catches the
# next one. design/, research/ and notes/ hold material read on GitHub.
[A-Z]*.md
research/
notes/
# The changelog stays beside the code. People compare the version they run
# with the one they are about to pull on GitHub, and its links are written
# relative to the repository, so --strict would fail on them as a page.
CHANGELOG.md
# Design and planning notes. They describe work in progress, parked ideas and
# open decisions, not how the released software behaves. The repository is
# public, so they stay readable on GitHub; this only keeps them off the site.
ROADMAP.md
SPACETIMEDB-MODE.md
TRANSCRIPTION.md
VIEWER-THEMES.md
# Long-form guides written for readers on GitHub, with links relative to the
# repository. The site gets its own pages for these topics. Remove a line
# here only when that file has been rewritten to be a site page.
MERGING-ARCHIVES.md
UPGRADING-8.0.md
# The docs build dependencies. The workflow reads them from docs/; they are
# not a page.
requirements-docs.txt
# Viewer design proposals, mockups and the screenshot rig, read on GitHub.
design/
"""
nav = [
  { Home = "index.md" },
  { "Get started" = [
      { "Run with Docker" = "getting-started/docker.md" },
      { "Run on Unraid" = "getting-started/unraid.md" },
      { "Log in to Telegram" = "getting-started/telegram-login.md" },
      { "Your first backup" = "getting-started/first-backup.md" },
      { "Install from PyPI" = "getting-started/pip.md" },
    ] },
  { Configuration = [
      { "Choosing chats" = "configuration/choosing-chats.md" },
      { "Media downloads" = "configuration/media.md" },
      { "Schedule and backup tuning" = "configuration/schedule.md" },
      { "Multiple accounts" = "configuration/multiple-accounts.md" },
      { "Real-time listener" = "configuration/listener.md" },
      { "Event webhook" = "configuration/event-webhook.md" },
      { "Voice transcription" = "configuration/transcription.md" },
      { "SQLite and PostgreSQL" = "configuration/database.md" },
    ] },
  { Viewer = [
      { "Using the viewer" = "viewer/using-the-viewer.md" },
      { "Logins, viewer accounts and share links" = "viewer/access.md" },
      { "Themes and wallpaper" = "viewer/themes.md" },
      { "Live updates and notifications" = "viewer/live-updates.md" },
      { "Exposing the viewer safely" = "viewer/exposing.md" },
    ] },
  { Operations = [
      { Upgrading = "operations/upgrading.md" },
      { "Backing up the archive" = "operations/backup-and-restore.md" },
      { "Import and maintenance tasks" = "operations/maintenance.md" },
      { "Monitoring and troubleshooting" = "operations/troubleshooting.md" },
    ] },
  { Reference = [
      { Glossary = "reference/glossary.md" },
      { "Environment variables" = "reference/environment-variables.md" },
      { "Command line and Python API" = "reference/cli.md" },
      { "HTTP API" = "reference/api.md" },
    ] },
  { Development = [
      { Development = "development.md" },
      { Roadmap = "roadmap/index.md" },
    ] },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
variant = "modern"
logo = "images/logo.svg"
favicon = "images/icon.svg"
font = false
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "content.code.copy",
  "content.action.edit",
  "search.highlight",
  "toc.follow",
  "navigation.instant",
  "navigation.instant.progress",
  "content.action.copy",
]
icon.repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/GeiserX/Telegram-Archive"

[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://hub.docker.com/r/drumsergio/telegram-archive"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/telegram-archive/"

[project.plugins.search]

[project.plugins.redirects.redirect_maps]
"contributing.md" = "development.md"

[project.plugins.llmstxt.sections]
Documentation = ["*.md", "*/*.md"]

# A preview image per page for links shared on chat apps and social sites
# (og:image and twitter:image). The card takes the site's own colours from
# docs/stylesheets/theme.css: the banner background #0E1621 and the banner
# title colour #F2F6FA; the logo is theme.logo. The font comes from Google
# Fonts at build time, which is why the docs workflow retries a failed font
# download.
[project.plugins.social]
cards_layout_options.background_color = "#0E1621"
cards_layout_options.color = "#F2F6FA"

[project.markdown_extensions]
admonition = {}
"pymdownx.details" = {}
"pymdownx.superfences".custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
"pymdownx.tabbed".alternate_style = true
"pymdownx.highlight".anchor_linenums = true
"pymdownx.inlinehilite" = {}
"pymdownx.snippets".base_path = [".", "docs"]
"pymdownx.snippets".check_paths = true
"pymdownx.mark" = {}
attr_list = {}
md_in_html = {}
"pymdownx.emoji".emoji_index = "zensical.extensions.emoji.twemoji"
"pymdownx.emoji".emoji_generator = "zensical.extensions.emoji.to_svg"
tables = {}
toc.permalink = true
