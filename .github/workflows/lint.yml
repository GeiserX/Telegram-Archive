name: Lint

on:
  push:
    branches: [main, master]
    paths: ['src/**', 'tests/**', 'scripts/**', 'alembic/**', '*.py', 'pyproject.toml', 'requirements*.txt', 'uv.lock', '.github/workflows/lint.yml']
  pull_request:
    # No paths filter: ruff is a required status check, so it must be able to run
    # on every PR (a docs- or compose-only PR would otherwise never satisfy it and
    # could never merge without admin override).
    branches: [main, master]

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Ruff's version is declared once, in uv.lock - an unpinned install lets
      # an upstream release red every PR with no change to this repo.
      - name: Install Ruff
        run: uv sync --locked --extra dev --no-install-project

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The hygiene hooks (check-yaml/toml, large-files, whitespace, EOF,
      # merge-conflict) used to run only on machines where someone had run
      # `pre-commit install` — a fork PR bypassed every one of them. Hook
      # versions are pinned by .pre-commit-config.yaml; pre-commit itself is
      # pinned here for the same hermeticity the ruff job documents above.
      - name: Run pre-commit on all files
        run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure
