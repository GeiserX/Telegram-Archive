name: Docker Hub Description

on:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/dockerhub-description.yml]
  workflow_dispatch:

jobs:
  update-description:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - repository: drumsergio/telegram-archive
            description: "Self-hosted Telegram backup: messages, media, edits and deletions to SQLite or PostgreSQL"
          - repository: drumsergio/telegram-archive-viewer
            description: "Web viewer to read and search a Telegram-Archive backup; it never talks to Telegram"
    steps:
      - uses: actions/checkout@v7

      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ matrix.repository }}
          short-description: ${{ matrix.description }}
