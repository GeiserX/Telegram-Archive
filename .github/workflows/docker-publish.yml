name: Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/**'
      - 'src/**'
      - 'alembic/**'
      - 'alembic.ini'
      - '.github/workflows/docker-publish.yml'
      # Exclude viewer-only changes
      - '!src/web/**'
      - '!Dockerfile.viewer'
      - '!.github/workflows/docker-publish-viewer.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Republish an existing release tag (e.g., v3.0.6): rebuilds THAT tagged commit. Leave empty to build main.'
        required: false
        type: string

env:
  DOCKER_IMAGE: drumsergio/telegram-archive

jobs:
  test:
    runs-on: ubuntu-latest
    # Repository-controlled code runs here; the token needs nothing but checkout.
    permissions:
      contents: read
    # PostgreSQL is a first-class supported backend, so the publish gate runs
    # against a real server, same as the Tests workflow.
    services:
      postgres:
        # Same pin as docker-compose.yml. Never :latest.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: telegram
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: telegram_archive_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telegram -d telegram_archive_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Deliberately not DATABASE_URL. src/db/base.py, alembic/env.py and
      # scripts/entrypoint.sh all treat DATABASE_URL as "the archive", so
      # exporting it job-wide would silently repoint every test that builds a
      # bare DatabaseManager() at PostgreSQL — where init() does not create
      # tables. This variable is read only by the real-engine fixtures in
      # tests/conftest.py, which never touch the database named here: they
      # create their own telegram_archive_pytest / _parity_* databases on it.
      TEST_POSTGRES_URL: postgresql://telegram:ci-not-a-secret@localhost:5432/telegram_archive_ci
    outputs:
      resolved_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # A dispatch republish must rebuild the TAGGED commit, never re-stamp a
      # version onto whatever ref the run happened to use. Refuse inputs that
      # are not existing git tags before anything builds. The input reaches the
      # shell via env, never inline interpolation.
      # Resolve the commit to build EXACTLY ONCE. Both jobs used to resolve
      # the tag name independently, so a tag re-pointed between the test
      # checkout and the build checkout published a commit the tests never
      # saw. The build job consumes this job's resolved SHA instead.
      - name: Resolve and pin the commit to build
        id: resolve
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            LINES=$(git ls-remote --exit-code --tags \
              "https://github.com/${{ github.repository }}" \
              "refs/tags/$DISPATCH_TAG" "refs/tags/$DISPATCH_TAG^{}") || {
              echo "::error::'$DISPATCH_TAG' is not an existing git tag - the image tag and the git tag may never disagree"
              exit 1
            }
            # Annotated tags list a peeled ^{} line with the commit; prefer it.
            SHA=$(printf '%s\n' "$LINES" | grep '\^{}' | cut -f1)
            [ -n "$SHA" ] || SHA=$(printf '%s\n' "$LINES" | head -n1 | cut -f1)
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          # Dispatch with a tag input builds that tag's commit; everything else
          # keeps building the triggering ref exactly as before.
          # The pinned commit: the dispatch tag's target, or the push's own SHA.
          ref: ${{ steps.resolve.outputs.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # Gate the publish on the exact versions this image ships (uv.lock)
      - name: Install dependencies
        run: uv sync --locked --extra dev --no-install-project
      # -rs prints skip reasons, which the next step reads. pipefail keeps a
      # pytest failure from being swallowed by tee.
      - name: Run lint and tests
        run: |
          set -o pipefail
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync python -m pytest tests/ -q -p no:cacheprovider --tb=short -rs | tee pytest-output.log
      # The dual-backend fixtures skip the PostgreSQL leg when no server
      # answers, so a broken service container would turn this job green while
      # testing half of what it claims to. Skipping is correct on a laptop
      # without Docker; in CI it is a failure.
      - name: Fail if the PostgreSQL leg was skipped
        run: |
          if grep -q "no PostgreSQL server reachable" pytest-output.log; then
            echo "::error::PostgreSQL tests were skipped - the service container was not reachable."
            echo "PostgreSQL is a first-class backend; this job must exercise it."
            exit 1
          fi
          echo "PostgreSQL leg ran."

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Same source rule as the test job: the dispatch tag input is
          # authoritative for the content, not just the image label.
          # The exact commit the test job resolved and tested - never a second
          # by-name resolution that could see a re-pointed tag.
          ref: ${{ needs.test.outputs.resolved_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix={{branch}}-,enable=${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # QEMU/buildx are set up above precisely for this: release manifests
          # ship amd64 + arm64 (Raspberry Pi, ARM NAS, Apple Silicon, Ampere).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Green must mean "both architectures are actually in the registry".
      # 8.1.0 and everything before it shipped amd64-only while this
      # workflow stayed green: QEMU was set up, platforms: was not (#337).
      # Read every tag just pushed back from the registry and gate on it.
      - name: Verify pushed tags ship amd64 and arm64
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          for tag in $TAGS; do
            docker buildx imagetools inspect --raw "$tag" \
              | python3 .github/scripts/check_manifest_arches.py "$tag"
          done
