name: GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract section for this version from CHANGELOG.md
          # Look for ## [version] and extract until next ## [
          if [ -f docs/CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[${VERSION#v}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" docs/CHANGELOG.md)
            if [ -n "$NOTES" ]; then
              echo "Found changelog notes for $VERSION"
              # Write to file to preserve newlines
              echo "$NOTES" > /tmp/release_notes.md
              echo "" >> /tmp/release_notes.md
              echo "---" >> /tmp/release_notes.md
              echo "" >> /tmp/release_notes.md
              echo "📋 **Full changelog:** [docs/CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/docs/CHANGELOG.md)" >> /tmp/release_notes.md
              echo "has_notes=true" >> $GITHUB_OUTPUT
            else
              echo "No changelog notes found for $VERSION"
              echo "has_notes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No CHANGELOG.md found"
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release with changelog
        if: steps.changelog.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release with auto-generated notes
        if: steps.changelog.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this workflow and the "pypi" environment,
    # so no API token exists anywhere. The OIDC token is the only credential.
    environment:
      name: pypi
      url: https://pypi.org/project/telegram-archive/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # A tag that disagrees with the version files would publish a package
      # whose version no git tag describes. Refuse before anything is built.
      - name: Check the tag matches the project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          PACKAGE_VERSION=$(python3 -c 'import re; print(re.search(r"^__version__ = \"([^\"]+)\"", open("telegram_archive/__init__.py").read(), re.M).group(1))')
          echo "tag=$TAG_VERSION pyproject=$PROJECT_VERSION package=$PACKAGE_VERSION"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ] || [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml ($PROJECT_VERSION) and telegram_archive/__init__.py ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Build the sdist and wheel
        run: uv build

      - name: Check the package before upload
        run: |
          uvx twine@7.0.0 check --strict dist/*
          python3 .github/scripts/check_dist.py dist
          .github/scripts/package_smoke.sh dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
