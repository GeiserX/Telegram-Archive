name: Docker Publish Dev

# Builds and pushes :dev tag for testing PRs before merging
# Dev/test instances use :dev tag for pre-production testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.viewer'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/**'
      - 'src/**'
      - 'alembic/**'
      - 'alembic.ini'
      - '.github/workflows/docker-publish-dev.yml'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even without changes'
        required: false
        type: boolean
        default: false

env:
  DOCKER_IMAGE: drumsergio/telegram-archive
  DOCKER_IMAGE_VIEWER: drumsergio/telegram-archive-viewer

jobs:
  build-and-push-dev:
    runs-on: ubuntu-latest
    # Only run for PRs from the same repo (not forks) or workflow_dispatch.
    # Dependabot PRs are excluded explicitly: they read the Dependabot secret
    # store, so DOCKERHUB_TOKEN is empty and the login step can never succeed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Dev images build on every PR: amd64-only keeps that loop fast. The
      # release workflows (docker-publish, docker-publish-viewer) publish the
      # multi-arch manifests; QEMU is set up there, not here.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log into Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push main backup image
      - name: Build and push backup image (dev)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          # Explicit, not inherited from the runner: dev stays amd64-only by
          # decision (speed), not by accident of the builder's architecture.
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push viewer image
      - name: Build and push viewer image (dev)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.viewer
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_IMAGE_VIEWER }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🐳 **Dev images published!**

              - \`drumsergio/telegram-archive:dev\`
              - \`drumsergio/telegram-archive-viewer:dev\`

              The dev/test instance will pick up these changes automatically (Portainer GitOps).

              To test locally:
              \`\`\`bash
              docker pull drumsergio/telegram-archive:dev
              docker pull drumsergio/telegram-archive-viewer:dev
              \`\`\``
            })
