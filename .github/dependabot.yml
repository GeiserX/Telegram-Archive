version: 2
updates:
  # uv, not pip: every CI job installs with `uv sync --locked`, so a bump that
  # rewrites pyproject.toml without relocking dies at resolution before a single
  # check runs (#410). The pip updater cannot write uv.lock; the uv one does, and
  # it is already what the security updates in this repo go through.
  # requirements.txt stays hand-maintained — it is loose `>=` floors kept for
  # `pip install -r`, not the source of truth the images build from.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - automated
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      uv_security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - ci
      - automated
    groups:
      github-actions:
        patterns:
          - '*'
      github_actions_security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: docker
    labels:
      - docker
      - automated
    groups:
      docker_security:
        applies-to: security-updates
        patterns:
          - '*'
