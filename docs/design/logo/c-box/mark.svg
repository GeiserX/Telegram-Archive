    <rect x="52" y="64" width="256" height="44" rx="14" fill="#2AABEE"/>
    <path d="M72 108 V270 A26 26 0 0 0 98 296 H262 A26 26 0 0 0 288 270 V108"/>
  </g>
  <rect x="104" y="142" width="116" height="40" rx="20" fill="#C5E4F3"/>
  <rect x="140" y="212" width="116" height="40" rx="20" fill="#7FC1EA"/>
</svg>
